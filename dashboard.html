<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanatorio Serena — Redirigiendo…</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f8f9ff; color: #0b1c30; }
  </style>
</head>
<body>
  <p>Cargando su panel…</p>
  <script>
    (async () => {
      let rol = 'administrador';
      if (window.sb) {
        const { data } = await window.sb.auth.getUser();
        if (!data || !data.user) { window.location.href = 'login.html'; return; }
        try {
          const res = await window.sb.from('profiles').select('rol').eq('id', data.user.id).single();
          rol = (res.data && res.data.rol) || 'administrador';
        } catch (e) { rol = 'administrador'; }
      } else {
        if (!sessionStorage.getItem('demo_usuario')) { window.location.href = 'login.html'; return; }
        rol = sessionStorage.getItem('demo_rol') || 'administrador';
      }
      window.location.href = rol === 'paciente' ? 'portal.html' : 'agenda.html';
    })();
  </script>
</body>
</html>
